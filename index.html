<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#162234">
<title>MHz Games</title>
<meta name="description" content="MHz Games — an independent mobile game studio. Drift Versus, a single-thumb touge racer, is coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,500;0,600;1,500;1,600&display=swap">
<style>
/* Palette copied from the game shell (TRV Shell.uss) and the privacy site,
   so the studio front door, the policy and the game read as one product. */
:root {
    --canvas:  #162234;
    --card:    #0D151B;
    --border:  #0B1119;
    --accent-yellow: #ECAE2C;
    --ink:      #f2ede4;
    --ink-mute: #9aa0b0;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--canvas);
    color: var(--ink);
    font-family: "Barlow Semi Condensed", "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
    font-size: 18px;
    line-height: 1.6;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    width: 100%;
    max-width: 40rem;
    margin: 0 auto;
    padding: 3rem 1.25rem;
}
.wordmark {
    margin: 0;
    font-style: italic;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: clamp(2.2rem, 9vw, 3.6rem);
    line-height: 1.05;
    color: var(--accent-yellow);
}
.tag {
    margin: 0.5rem 0 2.5rem;
    color: var(--ink-mute);
    font-style: italic;
}
.card {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 1.25rem 1.5rem;
}
.card h2 {
    margin: 0 0 0.25rem;
    font-size: 1.35rem;
    font-weight: 600;
    font-style: italic;
    text-transform: uppercase;
    letter-spacing: 0.03em;
}
.card p { margin: 0.25rem 0 0; }
.soon {
    display: inline-block;
    margin-top: 0.75rem;
    padding: 0.1rem 0.6rem;
    border: 1px solid var(--accent-yellow);
    color: var(--accent-yellow);
    font-size: 0.85rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
}
a { color: var(--accent-yellow); }
footer {
    width: 100%;
    max-width: 40rem;
    margin: 0 auto;
    padding: 1.5rem 1.25rem 2rem;
    color: var(--ink-mute);
    font-size: 0.95rem;
    border-top: 1px solid var(--border);
}
footer p { margin: 0.2rem 0; }
</style>
</head>
<body>
<main>
  <h1 class="wordmark">MHz Games</h1>
  <p class="tag">An independent mobile game studio.</p>

  <section class="card">
    <h2>Drift Versus</h2>
    <p>A single-thumb touge racer. One finger, one mountain road, one rival.</p>
    <span class="soon">Coming soon to iOS &amp; Android</span>
  </section>
</main>

<footer>
  <p>MHz Games — Muhammad Hazki Hariowibowo</p>
  <p><a href="mailto:hello@mhzgames.com">hello@mhzgames.com</a> · <a href="/support/">Support</a> · <a href="https://privacy.mhzgames.com/">Privacy policies</a></p>
</footer>
</body>
</html>
